###############################################################################
# Services (infrastructure)
###############################################################################

services:
  db:
    type: mariadb:10.11

  cache:
    type: redis:7.2

###############################################################################
# Routes — all traffic through gateway
###############################################################################

routes:
  "https://{default}/":
    type: upstream
    upstream: "gateway:http"

  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
