###############################################################################
# Upsun configuration — VetManager Pro
# Docs: https://docs.upsun.com
###############################################################################

applications:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  gateway:
    source:
      root: "/"
    type: "nodejs:20"
    build:
      flavor: none
    dependencies:
      nodejs:
        npm: "*"
    hooks:
      build: |
        npm install --omit=dev
    web:
      commands:
        start: "node gateway/src/index.js"
      upstream:
        socket_family: tcp
        protocol: http
    mounts:
      "/gateway/logs":
        source: local
        source_path: gateway-logs
    variables:
      env:
        NODE_ENV: production
        PORT: "8888"
        API_VERSION: v1
        WEBHOOK_WORKER: "false"
        OPENAPI_VALIDATE: "true"
    relationships:
      mysql: "db:mysql"
      redis: "cache:redis"

