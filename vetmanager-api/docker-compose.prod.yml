    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOST: mysql
      DB_NAME: vetmanager
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
