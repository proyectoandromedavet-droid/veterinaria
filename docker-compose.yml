version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vetmanager
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Port NOT exposed to host — only reachable inside vetnet
    volumes:
      - mysql_data:/var/lib/mysql
      - ../vetmanager_COMPLETO_FINAL.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - vetnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Port NOT exposed to host — only reachable inside vetnet
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - vetnet

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "4050:4050"
    env_file: .env
    environment:
      - PORT=4050
      - SERVICE_AUTH=http://auth:4051
      - SERVICE_PATIENTS=http://patients:4052
      - SERVICE_MEDICAL=http://medical:4053
      - SERVICE_LAB=http://lab-imaging:4054
      - SERVICE_BILLING=http://billing:4055
      - SERVICE_TELEMEDICINE=http://telemedicine:4056
      - SERVICE_GROOMING=http://grooming:4057
      - SERVICE_REPORTS=http://reports:4058
      - SERVICE_NOTIFICATIONS=http://notifications:4059
      - SERVICE_PORTAL=http://portal:4060
      - SERVICE_AI=http://ai:4061
      - SERVICE_DOCUMENTS=http://documents:4062
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4050/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks:
      - vetnet

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4051
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4051/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - vetnet

  patients:
    build:
      context: .
      dockerfile: services/patients/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4052
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4052/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - vetnet

  medical:
    build:
      context: .
