apiVersion: apps/v1
kind: Deployment
metadata:
  name: vetmanager-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vetmanager-gateway
  template:
    metadata:
      labels:
        app: vetmanager-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/ajpfox10/veterinaria-gateway:latest
          ports:
            - containerPort: 4050
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4050
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4050
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vetmanager-gateway
spec:
  selector:
    app: vetmanager-gateway
  ports:
    - port: 80
      targetPort: 4050

