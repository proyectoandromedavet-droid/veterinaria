apiVersion: apps/v1
kind: Deployment
metadata:
  name: vetmanager-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vetmanager-auth
  template:
    metadata:
      labels:
        app: vetmanager-auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/ajpfox10/veterinaria-auth:latest
          ports:
            - containerPort: 3001
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vetmanager-auth
spec:
  selector:
    app: vetmanager-auth
  ports:
    - port: 3001
      targetPort: 3001
