apiVersion: apps/v1
kind: Deployment
metadata:
  name: vetmanager-medical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vetmanager-medical
  template:
    metadata:
      labels:
        app: vetmanager-medical
    spec:
      containers:
        - name: medical
          image: ghcr.io/ajpfox10/veterinaria-medical:latest
          ports:
            - containerPort: 3003
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vetmanager-medical
spec:
  selector:
    app: vetmanager-medical
  ports:
    - port: 3003
      targetPort: 3003
