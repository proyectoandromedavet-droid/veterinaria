[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "gateway/src/**",
  "services/**/src/**",
  "shared/**",
  "plugins/**",
  "andromeda-front/src/**",
  "andromeda-front/public/**",
  "andromeda-front/index.html",
  "andromeda-front/vite.config.js",
  "package.json",
  "package-lock.json",
  "ecosystem.railway.config.js",
  "Dockerfile",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
