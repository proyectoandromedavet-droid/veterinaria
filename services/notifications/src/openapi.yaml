openapi: '3.0.3'
info:
  title: VetManager Notifications Service
  version: '1.0.0'
servers:
  - url: /
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
  /notifications:
    get:
      responses:
        '200':
          description: OK
  /notifications/{id}/read:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: No content
  /notifications/read-all:
    patch:
      responses:
        '204':
          description: No content
  /notifications/push:
    post:
      responses:
        '201':
          description: Created
  /notifications/reminders/generate:
    post:
      responses:
        '200':
          description: OK
  /notifications/reminders:
    get:
      responses:
        '200':
          description: OK
  /notifications/messages/send:
    post:
      responses:
        '200':
          description: OK
  /notifications/messages/template:
    post:
      responses:
        '200':
          description: OK
  /notifications/messages/reminder/{reminderId}:
    post:
      parameters:
        - in: path
          name: reminderId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /notifications/messages/bulk-reminders:
    post:
      responses:
        '200':
          description: OK
  /notifications/messages:
    get:
      responses:
        '200':
          description: OK
  /notifications/fcm/register:
    post:
      responses:
        '200':
          description: OK
  /notifications/fcm/unregister:
    delete:
      responses:
        '204':
          description: No content
  /notifications/fcm/tokens:
    get:
      responses:
        '200':
          description: OK
  /notifications/fcm/send:
    post:
      responses:
        '200':
          description: OK
  /notifications/fcm/broadcast:
    post:
      responses:
        '200':
          description: OK
