openapi: '3.0.3'
info:
  title: VetManager Patients Service
  version: '1.0.0'
  description: Patients, clients, species, breeds and branches management

servers:
  - url: /

components:
  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            code:
              type: string
            details:
              type: array
              items:
                type: object

    PaginatedMeta:
      type: object
      required: [total, page, limit]
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    PatientListItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        species:
          type: string
          nullable: true
        primary_owner:
          type: string
          nullable: true
        is_active:
          type: integer

    PatientDetail:
      type: object
      required: [id, name, owners, allergies, chronicConditions]
      properties:
        id:
          type: integer
        name:
          type: string
        species_name:
          type: string
          nullable: true
        breed_name:
          type: string
          nullable: true
        sex:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        is_active:
          type: integer
        owners:
          type: array
          items:
            type: object
        allergies:
          type: array
          items:
            type: object
        chronicConditions:
          type: array
          items:
            type: object

    CreatePatientRequest:
      type: object
      required: [name, speciesId, primaryOwnerId, sex]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        speciesId:
          type: integer
        breedId:
          type: integer
        primaryOwnerId:
          type: integer
        sex:
          type: string
          enum: [male, female, unknown]
        dateOfBirth:
          type: string
          format: date
        microchip:
          type: string
        notes:
          type: string

paths:
  /patients:
    get:
      summary: List patients (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: speciesId
          in: query
          schema:
            type: integer
        - name: species
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            oneOf:
              - type: string
                enum: ['true', 'false', 'all']
              - type: integer
                enum: [0, 1]
        - name: is_active
          in: query
          schema:
            oneOf:
              - type: string
                enum: ['true', 'false', 'all']
              - type: integer
                enum: [0, 1]
      responses:
        '200':
          description: Paginated list of patients
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientListItem'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /patients/{id}:
    get:
      summary: Get patient detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Patient detail
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PatientDetail'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                speciesId:
                  type: integer
                breedId:
                  type: integer
                sex:
                  type: string
                  enum: [male, female, unknown]
                birthdate:
                  type: string
                  format: date
                birthDate:
                  type: string
                  format: date
                chipNumber:
                  type: string
                microchip:
                  type: string
                microchipNumber:
                  type: string
                notes:
                  type: string
                is_active:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: Patient updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Deactivate patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /patients/species/all:
    get:
      summary: List all species (reference data)
      responses:
        '200':
          description: Species list
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, common_name]
                      properties:
                        id:
                          type: integer
                        common_name:
                          type: string
                        scientific_name:
                          type: string
                        category:
                          type: string

  /species/all:
    get:
      summary: List all species (public alias)
      responses:
        '200':
          description: Species list
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, common_name]
                      properties:
                        id:
                          type: integer
                        common_name:
                          type: string
                        scientific_name:
                          type: string
                        category:
                          type: string

  /patients/breeds/all:
    get:
      summary: List all breeds (reference data)
      parameters:
        - name: speciesId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Breeds list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  /breeds/all:
    get:
      summary: List all breeds (public alias)
      parameters:
        - name: speciesId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Breeds list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
