openapi: '3.0.3'
info:
  title: VetManager Documents Service
  version: '1.0.0'
servers:
  - url: /
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
  /providers:
    get:
      responses:
        '200':
          description: OK
  /mail-accounts:
    get:
      responses:
        '200':
          description: OK
    post:
      responses:
        '201':
          description: Created
  /mail-accounts/{id}:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: No content
  /mail-accounts/{id}/sync:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '202':
          description: Accepted
  /inbox:
    get:
      responses:
        '200':
          description: OK
  /inbox/manual:
    post:
      responses:
        '201':
          description: Created
  /inbox/upload:
    post:
      responses:
        '201':
          description: Created
  /inbox/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /inbox/{id}/download-url:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /inbox/{id}/associate:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /inbox/patients/{patientId}:
    get:
      parameters:
        - in: path
          name: patientId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
